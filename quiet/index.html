<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ТИХАЯ ОСЕНЬ — текстовый квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0a;--panel:#15110f;--line:#2a2119;--text:#e4d9c6;--muted:#8d806e;--acc:#e5ae62;--hp:#d4604f;--spirit:#c9a3e8;--water:#6fb9cc;--ok:#9bcf9a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Literata",Georgia,"Times New Roman",serif;line-height:1.65}
body{min-height:100vh}
.mono{font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:50;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5) 100%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:48;opacity:0}
#fx.dmg{animation:fxd .6s ease-out;background:radial-gradient(ellipse at center,transparent 35%,rgba(212,96,79,.4))}
#fx.heal{animation:fxd .8s ease-out;background:radial-gradient(ellipse at center,transparent 35%,rgba(155,207,154,.28))}
#fx.low{animation:fxd .8s ease-out;background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.55))}
#fx.lift{animation:fxd .9s ease-out;background:radial-gradient(ellipse at center,transparent 35%,rgba(229,174,98,.25))}
#fx.water{animation:fxd .8s ease-out;background:radial-gradient(ellipse at center,transparent 35%,rgba(111,185,204,.25))}
@keyframes fxd{0%{opacity:1}100%{opacity:0}}
/* меню */
#menu{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;text-align:center;overflow:hidden}
#menuart{position:absolute;inset:0;z-index:0;opacity:.8}
#menuart::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(13,11,10,.5),rgba(13,11,10,.2) 40%,rgba(13,11,10,.95))}
#menu>*:not(#menuart){position:relative;z-index:1}
#menu h1{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:clamp(38px,10vw,76px);letter-spacing:.2em;margin:0 0 0 .2em;color:var(--acc);text-shadow:0 0 30px rgba(229,174,98,.4),0 2px 0 rgba(0,0,0,.6);animation:hin 1.6s both}
@keyframes hin{from{opacity:0;letter-spacing:.5em;filter:blur(8px)}to{opacity:1;letter-spacing:.2em;filter:none}}
#menu .tag{color:#cdbfa8;max-width:31em;margin:0 0 14px;text-shadow:0 1px 8px #000;animation:fade 1.4s .5s both}
#menu .sub{font-family:"Share Tech Mono",ui-monospace,monospace;color:#b9a88e;font-size:13px;letter-spacing:.14em;animation:fade 1.4s .2s both}
.btn{font:inherit;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:16px;letter-spacing:.08em;background:rgba(13,11,10,.55);color:var(--acc);border:1px solid var(--acc);padding:13px 28px;min-width:250px;cursor:pointer;border-radius:3px;transition:.18s;backdrop-filter:blur(3px);animation:fade 1s .8s both}
.btn:hover{background:rgba(229,174,98,.14);transform:translateY(-1px)}
.btn.sec{color:#bfae92;border-color:#4a3d2f}
.menurow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.menurow .btn{min-width:120px;padding:10px 16px;font-size:14px}
#endsline{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;color:#b9a88e;min-height:1.4em;margin-top:4px}
/* игра */
#game{display:none;max-width:780px;margin:0 auto;padding:12px 16px 70px}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 88%,transparent);padding:8px 0 14px}
#topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.12em;color:var(--muted)}
#topline button{background:none;border:0;color:var(--muted);font:inherit;letter-spacing:.1em;cursor:pointer;padding:4px 0 4px 14px}
#topline button:hover{color:var(--acc)}
.bars{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px 16px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);letter-spacing:.1em}
.bar{position:relative}.bar .lab{display:flex;justify-content:space-between;margin-bottom:3px}
.segs{display:flex;gap:3px}.segs i{flex:1;height:9px;background:#1d1713;border-radius:1px;transition:background .3s}
.segs i.on.hp{background:var(--hp);box-shadow:0 0 6px rgba(212,96,79,.35)}
.segs i.on.spirit{background:var(--spirit);box-shadow:0 0 6px rgba(201,163,232,.3)}
.segs i.lost{animation:lostp .7s ease-out}
@keyframes lostp{0%{background:#fff}100%{background:#1d1713}}
.wbar{height:9px;background:#1d1713;border-radius:1px;overflow:hidden;position:relative}
#wfill{height:100%;background:linear-gradient(90deg,#4f9bb0,var(--water));transition:width .5s;position:relative}
#wfill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(110deg,rgba(255,255,255,0) 0 8px,rgba(255,255,255,.18) 8px 14px);background-size:28px 100%;animation:flow 1.6s linear infinite}
@keyframes flow{to{background-position:28px 0}}
#wfill.low{background:var(--hp);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
.float{position:absolute;right:0;top:-6px;font-size:14px;animation:flt 1.3s ease-out forwards;pointer-events:none}
.float.neg{color:var(--hp)}.float.pos{color:var(--ok)}.float.sp{color:var(--spirit)}
@keyframes flt{from{transform:translateY(0);opacity:1}to{transform:translateY(-26px);opacity:0}}
/* картинка */
#artbox{position:relative;width:100%;aspect-ratio:8/3;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#0a0807;margin:4px 0 4px}
#artbox .layer{position:absolute;inset:0;transition:opacity .9s ease}
#artbox .layer.out{opacity:0}
#artbox::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 60px rgba(0,0,0,.55);pointer-events:none}
#artcap{position:absolute;left:12px;bottom:8px;z-index:3;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:11px;letter-spacing:.2em;color:rgba(255,255,255,.72);text-shadow:0 1px 4px #000}
#title{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:16px 0 8px}
#text p{margin:0 0 1em;font-size:18px;animation:fade .55s both}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.sysmsg{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;color:var(--acc);padding:2px 0;animation:fade .4s both}
.narr{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:8px 0;color:#bdae96;font-style:italic;animation:fade .5s both}
#msgs{margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:16.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:12px 14px;cursor:pointer;border-radius:4px;line-height:1.45;transition:.16s;animation:fade .5s both;animation-delay:calc(var(--i)*70ms)}
.choice:hover{border-color:var(--acc);background:#1d1611;transform:translateX(3px)}
.choice .num{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--acc);min-width:1.1em}
.panel{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:14px}
.panel h3{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0 0 7px;font-weight:400}
.chip{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;border:1px solid var(--line);padding:3px 9px;margin:0 6px 6px 0;border-radius:3px;background:var(--panel);color:var(--text);font-family:inherit}
.chip svg{width:15px;height:15px;stroke:var(--acc);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
button.chip.use{cursor:pointer;color:var(--acc);border-color:var(--acc)}
button.chip.use:hover{background:rgba(229,174,98,.12)}
.chip.new{animation:newchip 1.2s ease-out}
@keyframes newchip{0%{box-shadow:0 0 0 0 rgba(229,174,98,.8)}100%{box-shadow:0 0 0 14px rgba(229,174,98,0)}}
.note{font-size:14px;color:#b9a98f;margin-bottom:3px}
.muted{color:var(--muted);font-size:14px}
.endbox{margin-top:26px}
.endinfo{text-align:center;margin:18px 0 6px}
.endtag{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.3em;color:var(--muted);font-size:12px}
.endcount{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;color:var(--acc);margin-top:4px}
.kind-bad .endtag::after{content:" · ПРОВАЛ";color:var(--hp)}
.kind-good .endtag::after{content:" · ДОМОЙ";color:var(--ok)}
.kind-best .endtag::after{content:" · ЛУЧШИЙ ФИНАЛ";color:var(--acc)}
.kind-neutral .endtag::after{content:" · ПУТЬ";color:var(--water)}
.kind-weird .endtag::after{content:" · ДРУГОЙ ФИНАЛ";color:var(--spirit)}
.endbtns{display:flex;flex-direction:column;gap:9px;margin-top:20px}
#screen{display:none;position:fixed;inset:0;z-index:60;background:rgba(13,11,10,.97);overflow:auto;padding:24px 16px}
#screen .inner{max-width:640px;margin:0 auto}
#screen h2{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--acc);letter-spacing:.2em;font-weight:400;margin:6px 0 4px}
.erow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:4px;padding:10px 12px;margin-bottom:8px}
.erow .thumb{width:84px;height:32px;border-radius:2px;overflow:hidden;flex:none;background:#0a0807}
.erow .thumb.lock{filter:grayscale(1) brightness(.25)}
.erow b{font-weight:600}.erow small{display:block;color:var(--muted)}
@media (max-width:560px){.bars{grid-template-columns:1fr 1fr}.bars .bar:last-child{grid-column:1/3}#text p{font-size:17px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}#grain{display:none}}
.artsvg{display:block;width:100%;height:100%}
.artsvg .cl{animation:cldrift linear infinite}
@keyframes cldrift{from{transform:translateX(-160px)}to{transform:translateX(900px)}}
.artsvg .star{animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.15}}
.artsvg .motes circle{animation:mote linear infinite}
@keyframes mote{0%{transform:translate(0,0);opacity:0}15%{opacity:.6}85%{opacity:.4}100%{transform:translate(24px,-46px);opacity:0}}
.artsvg .sway{animation:sway 5s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.8deg)}}
.artsvg .flick{animation:flick 3.4s ease-in-out infinite}
@keyframes flick{0%,100%{opacity:1}30%{opacity:.78}55%{opacity:.95}75%{opacity:.7}}
.artsvg .blink{animation:blinkr 2.4s steps(1) infinite}
@keyframes blinkr{50%{opacity:.1}}
.artsvg .shim{animation:shim 6s ease-in-out infinite}
@keyframes shim{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(14px);opacity:.22}}
.artsvg .birds{animation:birds 40s linear infinite}
@keyframes birds{from{transform:translateX(-120px)}to{transform:translateX(160px)}}
.artsvg .fogl{animation:fogl 18s ease-in-out infinite}
@keyframes fogl{50%{opacity:.12}}
.artsvg .fl{animation:fl .5s ease-in-out infinite alternate;transform-origin:0 0}
.artsvg .fl2{animation:fl .38s ease-in-out infinite alternate;transform-origin:0 0}
@keyframes fl{from{transform:scale(1,1)}to{transform:scale(.88,1.14)}}
.artsvg .sparks circle{animation:spark 3s linear infinite}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(14px,-90px);opacity:0}}
.artsvg .reel{animation:spin 3s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.artsvg .ring{transform-box:fill-box;transform-origin:center;animation:ringp 4s ease-out infinite;opacity:.8}
.artsvg .ring.r2{animation-delay:-2s}
@keyframes ringp{0%{transform:scale(.5);opacity:.9}100%{transform:scale(4.2);opacity:0}}
.artsvg .drips circle{animation:drip 3.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(0);opacity:0}10%{opacity:.8}60%{transform:translateY(240px);opacity:.6}100%{transform:translateY(250px);opacity:0}}
@media (prefers-reduced-motion:reduce){.artsvg *{animation:none!important}}
</style>
</head>
<body>
<div id="grain"></div><div id="vig"></div><div id="fx"></div>
<div id="menu">
  <div id="menuart"></div>
  <div class="sub">ТЕКСТОВЫЙ КВЕСТ · ПОСТАПОКАЛИПСИС</div>
  <h1>ТИХАЯ ОСЕНЬ</h1>
  <p class="tag">Тридцать один год назад мир замолчал за одну осень. Этой ночью в приёмнике заговорил голос. Он зовёт в город.</p>
  <button class="btn" id="newbtn">НАЧАТЬ ПУТЬ</button>
  <button class="btn sec" id="contbtn" style="display:none">ПРОДОЛЖИТЬ</button>
  <div class="menurow"><button class="btn sec" id="endsbtn">КОНЦОВКИ</button><button class="btn sec" id="sndbtn2">ЗВУК: ВКЛ</button></div>
  <div id="endsline"></div>
</div>
<div id="game">
  <div class="hud">
    <div id="topline"><span>ТИХАЯ ОСЕНЬ</span><span><button id="sndbtn">ЗВУК: ВКЛ</button><button id="menubtn">МЕНЮ</button></span></div>
    <div class="bars">
      <div class="bar" id="bar-hp"><div class="lab"><span>ЗДОРОВЬЕ</span><span id="hpv"></span></div><div class="segs" id="hp"></div></div>
      <div class="bar" id="bar-sp"><div class="lab"><span>ДУХ</span><span id="spv"></span></div><div class="segs" id="sp"></div></div>
      <div class="bar" id="bar-w"><div class="lab"><span>ВОДА</span><span id="wv"></span></div><div class="wbar"><div id="wfill"></div></div></div>
    </div>
  </div>
  <div id="artbox"><div id="artcap"></div></div>
  <div id="title"></div>
  <div id="msgs"></div>
  <div id="text"></div>
  <div class="choices" id="choices"></div>
  <div class="endbox" id="endbox"></div>
  <div class="panel" id="panel">
    <div><h3>РЮКЗАК</h3><div id="inv"></div></div>
    <div><h3>ЗАМЕТКИ</h3><div id="notes"></div></div>
  </div>
</div>
<div id="screen"></div>
<script>
'use strict';
/* ТИХАЯ ОСЕНЬ — данные игры, часть 1: предметы, помощники, дорога на юг */
const ITEMS = {
  bottle:'Фляга с водой', can:'Консервы', med:'Аптечка', lamp:'Налобный фонарь', rope:'Верёвка', radio:'Дедов приёмник',
  battery:'Аккумулятор', key:'Ключ-карта Архива', seeds:'Пакет семян', notebook:'Блокнот деда'
};
const ITEM_DESC = {
  bottle:'Применить: +35 воды.', can:'Применить: +2 здоровья.', med:'Применить: +4 здоровья.',
  lamp:'Без него в тёмных местах не пройти.', rope:'Пригодится у реки.', radio:'Ловит эфир. Если дать питание, может и передавать.',
  battery:'Тяжёлый, ещё держит заряд.', key:'Открывает дверь Башни Архива.', seeds:'Подсолнух. Всё ещё живой.', notebook:'Дедовы заметки. Почерк мелкий.'
};
const STACK = new Set(['bottle','can','med']);

function has(s,i){ return s.inv.includes(i); }
function sys(s,t){ s.msgs.push({k:'sys',t:t}); }
function give(s,i){ if(STACK.has(i) || !has(s,i)){ s.inv.push(i); sys(s,'Получено: '+ITEMS[i]); } }
function take(s,i){ const k=s.inv.indexOf(i); if(k>=0) s.inv.splice(k,1); }
function hurt(s,n){ s.hp=Math.max(0,s.hp-n); sys(s,'Здоровье −'+n); }
function heal(s,n){ s.hp=Math.min(10,s.hp+n); sys(s,'Здоровье +'+n); }
function low(s,n){ s.spirit=Math.max(0,s.spirit-n); sys(s,'Дух −'+n); }
function lift(s,n){ s.spirit=Math.min(10,s.spirit+n); sys(s,'Дух +'+n); }
function drink(s,n){ s.water=Math.min(100,s.water+n); sys(s,'Вода +'+n+'%'); }
function flag(s,k){ s.f[k]=true; }

const S = {};
/* разовый осмотр внутри сцены */
function look(key,t,note,fx,cond){
  return { t:t, if:s=>!s.f['lk_'+key] && (!cond || cond(s)), fx:s=>{ flag(s,'lk_'+key); if(fx) fx(s); }, note:note };
}
function E(id,title,kind,text){ S[id]={ t:title, end:true, kind:kind, text:text, ch:[] }; }
function dogHere(s){ return s.f.dog; }

/* ——— Дом ——— */
S.hut = { t:'Радиорубка', tod:'dawn', art:'hut', safe:true,
  text:s=>`Утро. Серый свет ползёт по полу радиорубки, и на столе проступают дедовы вещи: чашка, очки, блокнот, который он так и не дописал. Тихон ушёл весной. С тех пор ты слышишь только море и шипение приёмника.

Мир стал тихим тридцать один год назад, за одну осень. Ты родилась уже в нём. Тишина для тебя не пустота, а привычная мебель.

Но этой ночью в шипении приёмника был голос.${s.f.packed?'\n\nРюкзак собран. Дверь приоткрыта, и из щели тянет солью.':''}`,
  ch:[
    { t:'Прислушаться к приёмнику', if:s=>!s.f.heard_signal, fx:s=>{ flag(s,'heard_signal'); lift(s,1); },
      note:'Шипение, потом чистый женский голос: «…говорит Центральный вокзал Города-Семь. Есть вода. Есть свет. Есть люди. Приходите…» Пауза. И снова: «…говорит Центральный вокзал…» Третья ночь подряд. Слова те же, интонация та же, будто ничего не изменилось с первого раза.' },
    look('hut_book','Открыть дедов блокнот',
      'Мелкий почерк, много зачёркнутого. На последней странице: «Если дойдёшь до города, ищи Башню. Голос не верь, а слушай. Он зовёт не из жалости. Он зовёт, потому что ему нужно». И ниже, другим карандашом: «Прости, что не пошёл сам».',
      s=>{ give(s,'notebook'); flag(s,'read_book'); }),
    look('hut_room','Оглядеть рубку',
      'Полки с банками, провода под потолком, карта побережья с красными флажками: деда отмечал места, где находил что-то нужное. На подоконнике сухой цветок в жестяной кружке. Ты каждый день собиралась его выбросить.'),
    { t:'Собрать рюкзак', if:s=>!s.f.packed, fx:s=>{ flag(s,'packed'); give(s,'bottle'); give(s,'bottle'); give(s,'can'); give(s,'can'); give(s,'lamp'); },
      note:'Две фляги, пара банок консервов, налобный фонарь. Ты затягиваешь лямки и ловишь себя на том, что проверяешь рюкзак в третий раз. Руки сами тянут время.' },
    { t:'Взять дедов приёмник', if:s=>!has(s,'radio'), fx:s=>{ give(s,'radio'); lift(s,1); },
      note:'Тяжёлый, с потёртой ручкой. Дед говорил, что он «слышит дальше, чем видит». Ты прячешь его под куртку, поближе.' },
    { t:'Выйти на прибрежную дорогу', if:s=>s.f.packed, go:'coast' },
    { t:'Выйти без вещей (опасно)', if:s=>!s.f.packed, fx:s=>low(s,1), go:'coast' }
  ] };

S.coast = { t:'Прибрежная дорога', tod:'day', art:'coast',
  text:s=>`Дорога тянется вдоль моря на юг, потрескавшаяся, с травой в швах. Столбы линий электропередачи кренятся в разные стороны, как усталые люди. Над водой кричат чайки: единственные, кто не заметил, что мир затих.

Ты идёшь уже час. Горизонт не приблизился ни на шаг. ${dogHere(s)?'Уголь трусит рядом и время от времени оглядывается: не потерялась ли ты.':''}`,
  ch:[

E('end_seed','Семя','best',s=>`Колонна вспыхивает. Кольца света становятся ярче, быстрее, и вдоль стеллажей, один за другим, зажигаются огоньки. Тысячи. Десятки тысяч. Город вздрагивает: ты чувствуешь это подошвами, как дрожь после долгого сна.

E('end_silence','Тишина','good',s=>`— Спасибо, что не стала упрекать, — говорит Библиотекарь. — Я бы на твоём месте тоже не простил.

Ты идёшь домой. Три дня, четыре. По дороге ловишь себя на том, что не слышишь гула: он замолк. Город остаётся позади, не зовущий, не просящий. Просто город.

E('end_answer','Отклик','good',s=>`Красная точка на шкале мигает. Ты говоришь в микрофон, неловко, как в детстве: «Говорит Ника, радиорубка на побережье. Я в Городе-Семь. Если кто-то слышит, ответьте. Я не одна. Я здесь».

E('end_garden','Сад','weird',s=>`Ты остаёшься. Не потому, что нет сил идти. Просто здесь всё как будто на своём месте.

Садовники подвигают тебе скамью, кладут рядом яблоко. Дни становятся однообразными в самом лучшем смысле: полив, подвязка, закат. Твои руки темнеют от земли. Волосы пахнут мятой. ${s.f.dog?'Уголь спит в тени помидорных кустов, как на курорте.':''}

E('end_road','Дорога','neutral',s=>`Ты не заходишь в город. Остаёшься на южной трассе, смотришь на башни издали и поворачиваешь на юг.

function drawArt(key,tod){
  const f=ART[key]||ART.coast, p=PAL[tod]||PAL.day, id=++_artN;
  return '<svg viewBox="0 0 800 300" preserveAspectRatio="xMidYMid slice" class="artsvg" role="img" aria-hidden="true">'+f(p,id,tod||'day')+'</svg>';
}
/* ТИХАЯ ОСЕНЬ — ядро (без DOM) */
function newState(){ return { hp:10, spirit:10, water:100, inv:[], f:{}, scene:'hut', msgs:[], moves:0 }; }
function chOf(sc,s){ return typeof sc.ch==='function' ? sc.ch(s) : (sc.ch||[]); }
function visible(sc,s){ return chOf(sc,s).filter(c=>!c.if || c.if(s)); }
function settle(s){
  if(S[s.scene].end) return null;
  if(s.water<=0) return 'end_thirst';
  if(s.hp<=0) return 'end_hp';
  if(s.spirit<=0) return 'end_sleep';
  return null;
}
function moveTo(s,id){
  const sc=S[id]; if(!sc) throw new Error('no scene '+id);
  if(!sc.safe && !sc.end) s.water-=(sc.cost||5);
  s.scene=id; s.moves++;
  if(sc.enter){ const r=sc.enter(s); if(r) s.scene=r; }
  const d=settle(s); if(d) s.scene=d;
}
function choose(s,i){
  const sc=S[s.scene], vis=visible(sc,s), c=vis[i]; if(!c) return false;
  if(c.fx) c.fx(s);
  if(c.note) s.msgs.push({k:'n',t:c.note});

function renderHud(){

    else if(s.spirit>P.spirit){ SND.sfx('lift'); flash('lift'); floatNum('bar-sp','+'+(s.spirit-P.spirit),'pos'); }

  const ord=['end_seed','end_answer','end_silence','end_garden','end_road','end_thirst','end_sleep','end_hp'];
  const hints={end_seed:'Дать миру второй шанс.',end_answer:'Найти тех, кто тоже слушает.',end_silence:'Вернуться к морю.',end_garden:'Остаться среди растений.',end_road:'Не пойти туда, куда зовут.',end_thirst:'Дорога без воды.',end_sleep:'Устать слишком сильно.',end_hp:'Дойти и не дойти.'};
  ord.forEach(id=>{ const got=m.ends[id], sc=S[id]; h+='<div class="erow"><div class="thumb'+(got?'':' lock')+'">'+drawArt(id,PALKEY[id]||'day')+'</div><div><b>'+(got?sc.t:'???')+'</b><small>'+(got?hints[id]:'Ещё не найдена')+'</small></div></div>'; });
  h+='<div class="endbtns"><button class="btn sec" id="scback" style="animation:none;width:100%">Назад</button></div>';
  showScreen(h); $('scback').onclick=()=>{ hideScreen(); };
}
const PALKEY={end_seed:'dawn',end_silence:'dusk',end_answer:'dawn',end_garden:'day',end_road:'dawn',end_sleep:'night',end_thirst:'day',end_hp:'night'};
function showMenu(){
  SND.update(null); hideScreen(); $('game').style.display='none'; $('menu').style.display='flex';
  $('menuart').innerHTML=drawArt('hut','dawn');
  const n=Object.keys(meta().ends).length; $('endsline').textContent='Концовок: '+n+' из '+TOTAL_ENDS;
  $('contbtn').style.display=lsGet(SAVE_KEY)?'':'none';
}
function showGame(){ $('menu').style.display='none'; $('game').style.display='block'; }
function startGame(){ hideScreen(); lsDel(SAVE_KEY); s=newState(); prev=null; lastScene=null; showGame(); render(); }
function contGame(){ try{ const x=JSON.parse(lsGet(SAVE_KEY)); if(x&&S[x.scene]){ s=x; prev=null; lastScene=null; showGame(); render(); return; } }catch(e){} startGame(); }
$('newbtn').onclick=startGame; $('contbtn').onclick=contGame; $('endsbtn').onclick=showEnds; $('menubtn').onclick=showMenu;
function syncSnd(){ const t=SND.isOn()?'ЗВУК: ВКЛ':'ЗВУК: ВЫКЛ'; $('sndbtn').textContent=t; $('sndbtn2').textContent=t; }
function toggleSound(){ SND.setEnabled(!SND.isOn()); SND.setState(s&&$('game').style.display==='block'?s:null); if(SND.isOn()) SND.update(s&&$('game').style.display==='block'?s:null); syncSnd(); }
$('sndbtn').onclick=toggleSound; $('sndbtn2').onclick=toggleSound;
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{ if(SND.isOn()) SND.start(s&&$('game').style.display==='block'?s:null); },true));
document.addEventListener('keydown',e=>{
  if((e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь') && !e.ctrlKey && !e.metaKey){ toggleSound(); return; }
  if($('game').style.display==='none' || $('screen').style.display==='block') return;
  const n=parseInt(e.key,10); if(n>=1&&n<=9){ const v=visible(S[s.scene],s); if(v[n-1]) pick(n-1); }
});
syncSnd(); showMenu();
</script>
</body>
