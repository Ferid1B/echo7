<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭХО-7 — текстовый хоррор-квест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e11;--panel:#10161a;--line:#1d2a30;--text:#d5dcdf;--muted:#7b8a91;--acc:#7fe3d0;--hp:#e5594f;--san:#b79bff;--o2:#5ab6ff;--warn:#ffb454}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Literata",Georgia,"Times New Roman",serif;line-height:1.65}
body{min-height:100vh;transition:background .6s}
body.san6{background:#0b0d12}
body.san3{background:#100a0f}
.mono{font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
#menu{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:32px 20px;text-align:center}
#menu h1{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:clamp(44px,12vw,84px);letter-spacing:.28em;margin:0 0 0 .28em;color:var(--acc);text-shadow:0 0 28px rgba(127,227,208,.35)}
#menu .tag{color:var(--muted);max-width:30em;margin:0 0 18px}
#menu .sub{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--muted);font-size:13px;letter-spacing:.12em}
.btn{font:inherit;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:16px;letter-spacing:.08em;background:transparent;color:var(--acc);border:1px solid var(--acc);padding:13px 28px;min-width:240px;cursor:pointer;border-radius:3px;transition:.15s}
.btn:hover{background:rgba(127,227,208,.1)}
.btn.sec{color:var(--muted);border-color:var(--line)}
#game{display:none;max-width:760px;margin:0 auto;padding:14px 16px 60px}
.hud{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 0 14px}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;color:var(--muted);letter-spacing:.1em}
.bar .lab{display:flex;justify-content:space-between;margin-bottom:3px}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:9px;background:#182227;border-radius:1px}
.segs i.on.hp{background:var(--hp)}
.segs i.on.san{background:var(--san)}
.o2bar{height:9px;background:#182227;border-radius:1px;overflow:hidden}
#o2fill{height:100%;background:var(--o2);transition:width .4s}
#o2fill.low{background:var(--hp);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
#clock{display:none;align-items:center;justify-content:space-between;color:var(--hp);border:1px solid var(--hp);padding:3px 10px;margin-top:10px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.14em;animation:blink 1.2s infinite}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
#menubtn{background:none;border:0;color:var(--muted);font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;padding:4px 0}
#menubtn:hover{color:var(--acc)}
#title{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:18px 0 8px}
#text p{margin:0 0 1em;font-size:18px;animation:fade .5s}
#text p.whisper{color:var(--san);font-style:italic;opacity:.8}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sysmsg{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;color:var(--warn);padding:2px 0}
.narr{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:6px 0;color:#aab6bb;font-style:italic}
#msgs{margin-bottom:10px}
.choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;font-size:16.5px;color:var(--text);background:var(--panel);border:1px solid var(--line);padding:12px 14px;cursor:pointer;border-radius:4px;line-height:1.45;transition:.15s}
.choice:hover{border-color:var(--acc);background:#132026}
.choice .num{font-family:"Share Tech Mono",ui-monospace,monospace;color:var(--acc);min-width:1.1em}
.choice.whisperc{border-color:var(--san);color:#d9c9ff}
.choice.primary{border-color:var(--acc);color:var(--acc)}
.panel{margin-top:30px;border-top:1px solid var(--line);padding-top:14px;display:grid;gap:14px}
.panel h3{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.18em;color:var(--muted);margin:0 0 7px;font-weight:400}
.chip{display:inline-block;font-size:13.5px;border:1px solid var(--line);padding:3px 9px;margin:0 6px 6px 0;border-radius:3px;background:var(--panel);color:var(--text)}
button.chip.use{cursor:pointer;color:var(--acc);border-color:var(--acc);font-family:inherit}
button.chip.use:hover{background:rgba(127,227,208,.12)}
.note{font-size:14px;color:#aab6bb;margin-bottom:3px}
.muted{color:var(--muted);font-size:14px}
.endbox{margin-top:30px}
.endinfo{text-align:center;margin-bottom:6px}
.endtag{font-family:"Share Tech Mono",ui-monospace,monospace;letter-spacing:.3em;color:var(--muted);font-size:12px}
.endcount{font-family:"Share Tech Mono",ui-monospace,monospace;font-size:13px;color:var(--acc);margin-top:4px}
.kind-bad .endtag::after{content:" · ПРОВАЛ";color:var(--hp)}
.kind-good .endtag::after{content:" · ВЫЖИЛ";color:var(--acc)}
.kind-best .endtag::after{content:" · ЛУЧШИЙ ФИНАЛ";color:var(--warn)}
.kind-neutral .endtag::after{content:" · ЦЕНА";color:var(--warn)}
.kind-weird .endtag::after{content:" · ДРУГОЙ ФИНАЛ";color:var(--san)}
@media (max-width:520px){#text p{font-size:17px}.choice{font-size:16px}}

/* ================= ЭФФЕКТЫ И АНИМАЦИИ ================= */
#wave{position:fixed;left:0;bottom:0;width:100%;height:200px;pointer-events:none;z-index:0}
#menu,#game{position:relative;z-index:1}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);opacity:.35;mix-blend-mode:multiply}
#vig{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 140px 20px rgba(0,0,0,.65);transition:box-shadow .8s}
body.lowhp #vig{animation:vigRed 1.6s ease-in-out infinite}
body.lowsan #vig{animation:vigPurple 3s ease-in-out infinite}
@keyframes vigRed{0%,100%{box-shadow:inset 0 0 140px 20px rgba(0,0,0,.65)}50%{box-shadow:inset 0 0 160px 40px rgba(229,89,79,.42)}}
@keyframes vigPurple{0%,100%{box-shadow:inset 0 0 140px 20px rgba(0,0,0,.65)}50%{box-shadow:inset 0 0 170px 40px rgba(150,110,255,.34)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0}
#fx.dmg{animation:fxDmg .6s ease-out}
#fx.fear{animation:fxFear .9s ease-out}
#fx.heal{animation:fxHeal .8s ease-out}
#fx.calm{animation:fxCalm .8s ease-out}
#fx.air{animation:fxAir .8s ease-out}
@keyframes fxDmg{0%{opacity:1;box-shadow:inset 0 0 200px 60px rgba(229,89,79,.75);background:rgba(229,89,79,.14)}100%{opacity:0}}
@keyframes fxFear{0%{opacity:1;box-shadow:inset 0 0 200px 60px rgba(150,110,255,.7);background:rgba(150,110,255,.12)}40%{opacity:.7}100%{opacity:0}}
@keyframes fxHeal{0%{opacity:1;box-shadow:inset 0 0 200px 50px rgba(110,230,150,.5)}100%{opacity:0}}
@keyframes fxCalm{0%{opacity:1;box-shadow:inset 0 0 200px 50px rgba(183,155,255,.5)}100%{opacity:0}}
@keyframes fxAir{0%{opacity:1;box-shadow:inset 0 0 200px 50px rgba(90,182,255,.5)}100%{opacity:0}}
#game.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-7px,2px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-5px,3px)}60%{transform:translate(4px,-2px)}80%{transform:translate(-2px,1px)}}
#game.glitchy #text,#game.glitchy #title{animation:glitchText .7s steps(2,end)}
@keyframes glitchText{0%{transform:translateX(0);text-shadow:-2px 0 #ff4f7a,2px 0 #4fe0ff}20%{transform:translateX(-4px) skewX(3deg);text-shadow:3px 0 #ff4f7a,-3px 0 #4fe0ff}40%{transform:translateX(5px);clip-path:inset(20% 0 40% 0)}60%{transform:translateX(-2px);clip-path:none;text-shadow:-2px 0 #ff4f7a,2px 0 #4fe0ff}100%{transform:none;text-shadow:none}}

/* — шкалы — */
.bar{position:relative}
.segs i{position:relative;overflow:hidden;transition:background .3s,transform .3s,opacity .3s}
.segs i.on.hp{background:linear-gradient(90deg,#b8362e,#ff6a5c 45%,#b8362e);background-size:200% 100%;
  animation:liquid 2.6s linear infinite,beat 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s),calc(var(--i)*.07s);
  box-shadow:0 0 8px rgba(229,89,79,.45)}
.segs i.on.san{background:linear-gradient(90deg,#7a5ee0,#cdb8ff 45%,#7a5ee0);background-size:200% 100%;
  animation:liquid 3.4s linear infinite,twinkle 2.2s ease-in-out infinite;animation-delay:calc(var(--i)*-.21s),calc(var(--i)*.15s);
  box-shadow:0 0 8px rgba(160,125,255,.4)}
.segs i.on::after{content:"";position:absolute;top:0;left:-60%;width:50%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);
  animation:sweep 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.12s)}
@keyframes liquid{to{background-position:200% 0}}
@keyframes beat{0%,100%{transform:scaleY(1)}12%{transform:scaleY(1.55)}24%{transform:scaleY(1)}36%{transform:scaleY(1.3)}}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.62}}
@keyframes sweep{0%,55%{left:-60%}100%{left:130%}}
body.lowhp .segs i.on.hp{animation:liquid 1.4s linear infinite,beat .7s ease-in-out infinite;animation-delay:calc(var(--i)*-.17s),calc(var(--i)*.04s)}
body.lowsan .segs i.on.san{animation:liquid 1.2s linear infinite,jitter .25s steps(2) infinite}
@keyframes jitter{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
.segs i.lost{animation:lost .6s ease-out}
@keyframes lost{0%{background:#fff;transform:scale(1.5)}100%{transform:scale(1)}}
.segs i.gain{animation:gain .7s ease-out}
@keyframes gain{0%{transform:scale(1.8);filter:brightness(2.2)}100%{transform:scale(1)}}

.o2bar{position:relative;height:11px;border-radius:6px;box-shadow:inset 0 0 0 1px #213038}
#o2fill{position:relative;height:100%;border-radius:6px;overflow:hidden;transition:width .8s cubic-bezier(.3,.8,.3,1);
  background:linear-gradient(180deg,#8fd3ff,#3a8fe0 60%,#2a6fb8);box-shadow:0 0 12px rgba(90,182,255,.5)}
#o2fill::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.28) 0 8px,transparent 8px 22px);background-size:44px 100%;animation:flow 1.6s linear infinite}
#o2fill::after{content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 20% 70%,rgba(255,255,255,.8) 0 1.5px,transparent 2px),radial-gradient(circle at 55% 40%,rgba(255,255,255,.7) 0 1.5px,transparent 2px),radial-gradient(circle at 85% 65%,rgba(255,255,255,.8) 0 1.5px,transparent 2px);
  background-size:60px 100%;animation:bubbles 2.8s linear infinite}
@keyframes flow{to{background-position:44px 0}}
@keyframes bubbles{0%{background-position:0 14px;opacity:0}30%{opacity:1}100%{background-position:20px -14px;opacity:0}}
#o2fill.low{background:linear-gradient(180deg,#ff9a90,#e5594f 60%,#a8352c);box-shadow:0 0 14px rgba(229,89,79,.7);animation:blink .8s infinite}

.float{position:absolute;right:0;top:-4px;font-family:"Share Tech Mono",ui-monospace,monospace;font-size:15px;font-weight:700;pointer-events:none;animation:floatUp 1.3s ease-out forwards;text-shadow:0 0 10px currentColor}
.float.neg{color:#ff7468}.float.pos{color:#7fe3d0}.float.fear{color:#cdb8ff}
@keyframes floatUp{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-28px)}}
.bar .lab b{font-weight:400;color:var(--text)}

/* — текст и выборы — */
#text p{animation:revealP .5s ease-out both}
@keyframes revealP{0%{opacity:0;transform:translateY(8px);filter:blur(5px)}100%{opacity:1;transform:none;filter:none}}
#title{position:relative;display:inline-block}
#title::before{content:"";display:inline-block;width:7px;height:7px;background:var(--acc);margin-right:10px;box-shadow:0 0 10px var(--acc);animation:blink 1.4s infinite}
.choice{animation:choiceIn .3s ease-out both;position:relative;overflow:hidden}
@keyframes choiceIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
.choice::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(127,227,208,.18),transparent);transform:skewX(-20deg);transition:left .5s}
.choice:hover::before{left:130%}
.choice:hover{transform:translateX(4px);box-shadow:0 0 18px rgba(127,227,208,.15)}
.choice:active{transform:scale(.99)}
.choice.whisperc{animation:choiceIn .5s ease-out both,whispGlow 2.4s ease-in-out infinite}
@keyframes whispGlow{0%,100%{box-shadow:0 0 0 rgba(183,155,255,0)}50%{box-shadow:0 0 22px rgba(183,155,255,.5)}}
.sysmsg{animation:slideIn .5s ease-out both}
.narr{animation:slideIn .7s ease-out both}
@keyframes slideIn{0%{opacity:0;transform:translateX(-12px)}100%{opacity:1;transform:none}}
body.lowsan #text p{animation:revealP .5s ease-out both,flick 3s steps(1) infinite}
@keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}

/* — инвентарь — */
.chip{display:inline-flex;align-items:center;gap:7px;transition:.2s}
.chip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.chip:hover{border-color:var(--acc);box-shadow:0 0 14px rgba(127,227,208,.25);transform:translateY(-2px)}
.chip.new{animation:chipPop .9s cubic-bezier(.2,1.4,.4,1)}
@keyframes chipPop{0%{transform:scale(.3);opacity:0;box-shadow:0 0 0 rgba(127,227,208,0)}50%{transform:scale(1.2);box-shadow:0 0 28px rgba(127,227,208,.9);border-color:var(--acc)}100%{transform:scale(1)}}
button.chip.use{animation:usePulse 2.2s ease-in-out infinite}
@keyframes usePulse{0%,100%{box-shadow:0 0 0 rgba(127,227,208,0)}50%{box-shadow:0 0 14px rgba(127,227,208,.4)}}
.note{animation:slideIn .6s ease-out both}
.note.newn{color:var(--acc);animation:noteNew 1.6s ease-out}
@keyframes noteNew{0%{background:rgba(127,227,208,.3)}100%{background:transparent}}

/* — меню — */
#menu h1{animation:hIn .4s ease-out .05s both,titleGlow 2.4s ease-in-out .5s infinite,titleFlick 4.6s steps(1) 1.2s infinite;position:relative}
@keyframes hIn{0%{opacity:0;filter:blur(10px);transform:scale(1.08)}100%{opacity:1;filter:none;transform:none}}
@keyframes titleGlow{0%,100%{text-shadow:0 0 22px rgba(127,227,208,.3)}50%{text-shadow:0 0 44px rgba(127,227,208,.7),0 0 90px rgba(127,227,208,.25)}}
#menu h1::before,#menu h1::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:0;pointer-events:none;text-shadow:none}
#menu h1.gl::before{color:#ff4f7a;opacity:.85;transform:translateX(-6px);clip-path:inset(15% 0 55% 0)}
#menu h1.gl::after{color:#4fe0ff;opacity:.85;transform:translateX(6px);clip-path:inset(55% 0 12% 0)}
#menu>*:not(h1){animation:choiceIn .45s ease-out both}
.btn{position:relative;overflow:hidden}
.btn::before{content:"";position:absolute;top:0;left:-70%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(127,227,208,.3),transparent);transform:skewX(-20deg);transition:left .6s}
.btn:hover::before{left:130%}
.btn:hover{box-shadow:0 0 24px rgba(127,227,208,.3)}
#clock{box-shadow:0 0 20px rgba(229,89,79,.35)}
.endbox .endtag{animation:endIn 1.2s ease-out both}
@keyframes endIn{0%{letter-spacing:1em;opacity:0}100%{letter-spacing:.3em;opacity:1}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-delay:0s!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  #text p,.choice,#menu>*{opacity:1!important;filter:none!important}
}
#title.tin{animation:titleIn .7s ease-out}
@keyframes titleIn{0%{opacity:0;letter-spacing:.6em;filter:blur(4px)}100%{opacity:1;letter-spacing:.2em;filter:none}}


/* ================= ВТОРАЯ ВОЛНА ЭФФЕКТОВ ================= */
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#grain{position:fixed;inset:-60px;pointer-events:none;z-index:48;opacity:.075;mix-blend-mode:overlay;will-change:transform;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  animation:grain .5s steps(1) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-30px,20px)}40%{transform:translate(25px,-35px)}60%{transform:translate(-15px,-20px)}80%{transform:translate(35px,25px)}100%{transform:translate(0,0)}}
#beam{position:fixed;left:0;right:0;height:140px;top:-140px;pointer-events:none;z-index:41;
  background:linear-gradient(transparent,rgba(127,227,208,.06) 70%,rgba(127,227,208,.16) 99%,transparent);animation:beam 5.5s linear infinite}
body.lowsan #beam{background:linear-gradient(transparent,rgba(183,155,255,.07) 70%,rgba(183,155,255,.2) 99%,transparent);animation-duration:3s}
@keyframes beam{to{top:100%}}
#wipe{position:fixed;left:0;right:0;top:-6px;height:3px;background:var(--acc);box-shadow:0 0 22px 6px rgba(127,227,208,.6);opacity:0;z-index:46;pointer-events:none}
#wipe.go{animation:wipe .4s ease-in}
@keyframes wipe{0%{top:-6px;opacity:1}100%{top:100%;opacity:.3}}
.ping{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border:1.5px solid var(--acc);border-radius:50%;pointer-events:none;z-index:60;animation:ping .65s ease-out forwards}
@keyframes ping{0%{transform:scale(1);opacity:.9}100%{transform:scale(7);opacity:0}}
body.blip #game,body.blip #menu{animation:blip .24s steps(3)}
@keyframes blip{0%{transform:translateX(-4px) skewX(-2deg);filter:hue-rotate(40deg) brightness(1.5)}50%{transform:translateX(5px);filter:brightness(.6)}100%{transform:none;filter:none}}

/* ЭКГ рядом со здоровьем */
.ecg{width:46px;height:12px;margin-left:8px;vertical-align:-1px;overflow:visible}
.ecg polyline{fill:none;stroke:#ff6a5c;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70 70;
  animation:ecg 1.5s linear infinite;filter:drop-shadow(0 0 3px #ff6a5c)}
body.lowhp .ecg polyline{animation-duration:.6s}
@keyframes ecg{from{stroke-dashoffset:70}to{stroke-dashoffset:-70}}

/* выборы: стрелка и мерцание */
.choice::after{content:"▸";margin-left:auto;padding-left:10px;color:var(--acc);opacity:0;transform:translateX(-8px);transition:.2s}
.choice:hover::after{opacity:1;transform:none}
.choice:hover .num{animation:numFlick .5s steps(2)}
@keyframes numFlick{50%{opacity:.3}}

/* МЕНЮ: эхо-кольца, пульс, быстрые вспышки */
#menu{overflow:hidden}
.hero{position:relative;display:flex;align-items:center;justify-content:center;width:100%}
.rings{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.rings span{position:absolute;left:-50px;top:-50px;width:100px;height:100px;border:1px solid rgba(127,227,208,.55);border-radius:50%;opacity:0;animation:ring 8.5s ease-out infinite}
.rings span:nth-child(2){animation-delay:.4s}.rings span:nth-child(3){animation-delay:.8s}
@keyframes ring{0%{transform:scale(.3);opacity:.8}30%{transform:scale(9);opacity:0}100%{transform:scale(9);opacity:0}}
@keyframes titleFlick{0%,90%,94%,100%{opacity:1}92%{opacity:.45}96%{opacity:.7}}
#menu h1.gl{animation-play-state:running}
#menu #newbtn{animation:choiceIn .45s ease-out .25s both,btnPulse 1.8s ease-in-out .8s infinite}
@keyframes btnPulse{0%,100%{box-shadow:0 0 0 rgba(127,227,208,0)}50%{box-shadow:0 0 26px rgba(127,227,208,.45),inset 0 0 14px rgba(127,227,208,.12)}}
#menu>*:nth-child(1){animation-delay:.05s}#menu>*:nth-child(3){animation-delay:.2s}
#menu>*:nth-child(5){animation-delay:.3s}#menu>*:nth-child(6){animation-delay:.35s}#menu>*:nth-child(7){animation-delay:.4s}
#menu .tag{min-height:3.3em}
@media (prefers-reduced-motion:reduce){#grain,#beam,#dust,.rings{display:none}}

/* звук */
.sndmini{background:none;border:0;color:var(--muted);font-family:"Share Tech Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;padding:4px 10px 4px 0}
.sndmini:hover{color:var(--acc)}
.sndmini.off,.btn.sec.off{opacity:.55}
.btn.sec{min-width:240px;padding:10px 28px;font-size:14px}
</style>
</head>
<body>
<canvas id="dust"></canvas>
<canvas id="wave"></canvas>
<div id="grain"></div>
<div id="beam"></div>
<div id="wipe"></div>
<div id="vig"></div>
<div id="fx"></div>
<div id="menu">
  <div class="sub">ТЕКСТОВЫЙ КВЕСТ · ХОРРОР · ВЫЖИВАНИЕ</div>
  <div class="hero"><div class="rings"><span></span><span></span><span></span></div><h1 data-t="ЭХО-7">ЭХО-7</h1></div>
  <p class="tag">Станция молчит одиннадцать суток. Ты проснулся не по расписанию. Они реагируют на звук, так что не шуми.</p>
  <button class="btn" id="newbtn">НОВАЯ ИГРА</button>
  <button class="btn" id="contbtn" style="display:none">ПРОДОЛЖИТЬ</button>
  <button class="btn sec" id="sndbtn">ЗВУК: ВКЛ</button>
  <div class="sub" id="endsline"></div>
  <div class="sub">Выбирай кнопками или цифрами 1–9 · M — звук</div>
</div>
<div id="game">
  <div class="hud">
    <div id="topline"><span class="sub mono" style="font-size:12px;color:var(--muted);letter-spacing:.14em">ЭХО-7</span><span><button id="sndbtn2" class="sndmini">ЗВУК</button> <button id="menubtn">МЕНЮ</button></span></div>
    <div class="bars">
      <div class="bar" id="bar-hp"><div class="lab"><span>ЗДОРОВЬЕ<svg class="ecg" viewBox="0 0 60 14" aria-hidden="true"><polyline points="0,7 12,7 16,7 19,1 23,13 27,7 39,7 42,4 45,7 60,7"/></svg></span><b id="hpv"></b></div><div class="segs" id="hp"></div></div>
      <div class="bar" id="bar-san"><div class="lab"><span>РАССУДОК</span><b id="sanv"></b></div><div class="segs" id="san"></div></div>
      <div class="bar" id="bar-o2" style="grid-column:1/3"><div class="lab"><span>КИСЛОРОД</span><b id="o2val"></b></div><div class="o2bar"><div id="o2fill"></div></div></div>
    </div>
    <div id="clock"><span>ПЕРЕГРУЗКА РЕАКТОРА</span><span>осталось шагов: <b id="clockval"></b></span></div>
  </div>
  <div id="title"></div>
  <div id="msgs"></div>
  <div id="text"></div>
  <div class="choices" id="choices"></div>
  <div class="panel">
    <div><h3>ИНВЕНТАРЬ</h3><div id="inv"></div></div>
    <div><h3>ЗАМЕТКИ</h3><div id="notes"></div></div>
  </div>
</div>
<script>
'use strict';
/* ЭХО-7 — данные игры (часть 1: предметы, помощники, начало, коридор) */
const ITEMS = {
  lamp:'Налобный фонарь', crowbar:'Ломик', med:'Аптечка', sedative:'Седатив', serum:'Сыворотка V-7',
  card1:'Карта доступа (ур. 1)', card2:'Карта капитана (ур. 2)', fuse:'Предохранитель питания',
  radio:'Рация Давида', nav:'Навигационный кристалл', cutter:'Плазменный резак'
};
const ITEM_DESC = {
  lamp:'Светит. Без него в тёмных местах страшнее.', crowbar:'Тяжёлый, шумный.',
  med:'Применить: +4 к здоровью.', sedative:'Применить: +3 к рассудку.', serum:'Применить: стереть то, что ты услышал, и +3 к рассудку.',
  card1:'Открывает лабораторный лифт, реактор, инструментальную клетку.', card2:'Открывает мостик и каюту капитана.',
  fuse:'Нужен ангарной двери.', radio:'Шумит. Можно использовать как приманку.', nav:'Без него шаттл не полетит.',
  cutter:'Режет почти всё. Даже лёд, который не лёд.'
};
const STACK = new Set(['med','sedative','serum']);
const CODE = { a:'41', b:'07', c:'93' };

function has(s,i){ return s.inv.includes(i); }
function sys(s,t){ s.msgs.push({k:'sys',t:t}); }
function give(s,i){ if(STACK.has(i) || !has(s,i)){ s.inv.push(i); sys(s,'Получено: '+ITEMS[i]); } }
function take(s,i){ const k=s.inv.indexOf(i); if(k>=0) s.inv.splice(k,1); }
function hurt(s,n){ s.hp=Math.max(0,s.hp-n); sys(s,'Здоровье −'+n); }
function heal(s,n){ s.hp=Math.min(10,s.hp+n); sys(s,'Здоровье +'+n); }
function fear(s,n){ s.san=Math.max(0,s.san-n); sys(s,'Рассудок −'+n); }
function calm(s,n){ s.san=Math.min(10,s.san+n); sys(s,'Рассудок +'+n); }
function air(s,n){ s.o2=Math.min(100,s.o2+n); sys(s,'Кислород +'+n+'%'); }
function loud(s,n){ s.noise+=(n||1); }
function flag(s,k){ s.f[k]=true; }
function codesKnown(s){ return s.f.code_a && s.f.code_b && s.f.code_c; }

const S = {};

S.start = { t:'Пробуждение', safe:true,
  text:`Крышка капсулы уходит вверх с хрустом, будто лопается лёд.

Ты не помнишь, как засыпал. Помнишь только расписание: подъём через четыре месяца, по плану, с кофе и приветствием капитана. Вместо этого — красный свет, холод и тишина. Слишком плотная: как вата в ушах.

— Лев Савин, — произносит ровный женский голос из потолка. — Это МАРТА, бортовой интеллект станции «Эхо-7». Я рада, что вы живы. Прошу вас не повышать голос.`,
  ch:[{ t:'Сесть и осмотреться', go:'bay' }] };

S.bay = { t:'Криоотсек', safe:true,
  text:s=>`Шесть капсул. Пять пусты, крышки отброшены изнутри, на стенках — вмятины от ударов. Шестая — твоя. Экипаж проснулся по расписанию. Ты — нет.

Дверь в коридор заперта вручную: рычаг с красной маркировкой. На стене — шкафчик медслужбы и ящик с инструментами. Динамик МАРТЫ мигает под потолком.${s.f.bay_air?'':'\n\nУ стены — панель кислородного питания криоотсека.'}`,
  ch:[
    { t:'Открыть шкафчик медслужбы', if:s=>!s.f.locker, fx:s=>{ flag(s,'locker'); give(s,'lamp'); give(s,'med'); }, go:null },
    { t:'Взять ломик из ящика с инструментами', if:s=>!s.f.toolbox, fx:s=>{ flag(s,'toolbox'); give(s,'crowbar'); } },
    { t:'Подключить скафандр к кислородной панели', if:s=>!s.f.bay_air, fx:s=>{ flag(s,'bay_air'); air(s,30); } },
    { t:'Поговорить с МАРТОЙ', go:'marta' },
    { t:s=>has(s,'lamp')?'Открыть дверь и выйти в коридор':'Выйти в коридор без света (страшно)',
      fx:s=>{ if(!has(s,'lamp')) fear(s,2); }, go:s=>s.f.sing1?'corr':'sing1' }
  ] };

S.marta = { t:'МАРТА', safe:true,
  text:`— Одиннадцать суток назад экипаж перестал отвечать на вызовы, — говорит МАРТА. — Жизнеобеспечение в норме, но датчики жилого кольца и лабораторий вышли из строя. Я слышу станцию только… фрагментами. Зато слышу вот что.

Из динамиков на секунду вырывается низкий, чистый звук — будто кто-то ведёт мокрым пальцем по краю бокала. Голос МАРТЫ срывается и возвращается:

— Прошу прощения. Помехи. Основное, Лев: не шумите. Они реагируют на звук.`,
  ch:[
    { t:'«Кто такие „они“?»', go:'marta2' },
    { t:'«Как мне выбраться отсюда?»', go:'marta3' },
    { t:'Вернуться', go:'bay' }
  ] };

S.marta2 = { t:'МАРТА', safe:true,
  text:`— Экипаж, — коротко отвечает МАРТА. — Или то, что от него осталось. Доктор Вахрушева назвала это Хором. Её записи — в жилом кольце, в каюте. Я не могу подтвердить их достоверность. Я могу лишь подтвердить, что они поют, и что пение распространяется.

Пауза.

— Образец L-9 подняли из ледяного керна на третьи сутки после прибытия. Лабораторное кольцо на карантине, но карантин, как выяснилось, слушает не всех.`,
  ch:[ { t:'Назад', go:'marta' } ] };

S.marta3 = { t:'МАРТА', safe:true,
  text:`— Протокол допускает три варианта, — говорит МАРТА, и ты слышишь в её голосе что-то вроде усталости. — Первый: шаттл «Ласточка» в ангаре. Ему нужны предохранитель питания из машинного отделения и навигационный кристалл с мостика. Второй: сигнал бедствия с мостика. Антенна повреждена, чинить придётся снаружи, через шлюз машинного.

Третий вариант: перегрузка реактора. Код из трёх частей: у доктора, у капитана и в журнале вахты на мостике. Третий вариант — рекомендация номер ноль. Вы её не слышали.

— И есть четвёртый, — добавляет она тише. — Но я его не называла.`,
  ch:[ { t:'Назад', go:'marta' } ] };

S.sing1 = { t:'Поющий в коридоре',
  text:`Коридор круто изгибается вдоль кольца станции. В тридцати метрах, у пятна аварийного света, стоит человек в комбинезоне инженера. Давид, судя по нашивке. Он стоит лицом к стене и тихо-тихо тянет одну ноту. Не мелодию. Ноту.

Чем дольше слушаешь, тем сильнее хочется подпеть.`,
  ch:[
    { t:'Замереть и тихо пройти мимо вдоль стены', fx:s=>{ flag(s,'sing1'); fear(s,1); }, go:'corr',
      note:'Ты идёшь, не дыша. Каждый шаг — как по тонкому льду. Давид не оборачивается.' },
    { t:'Ударить его ломиком', if:s=>has(s,'crowbar'), fx:s=>{ flag(s,'sing1'); flag(s,'david_dead'); hurt(s,1); loud(s,1); give(s,'radio'); }, go:'corr',
      note:'Удар. Ещё. Он даже не пытается защищаться — просто перестаёт петь. Тишина после этого звука оглушает. В кармане его комбинезона — портативная рация, ещё тёплая.' },
    { t:'Броситься на него голыми руками', if:s=>!has(s,'crowbar'), fx:s=>{ flag(s,'sing1'); flag(s,'david_dead'); hurt(s,4); loud(s,1); give(s,'radio'); }, go:'corr',
      note:'Он тяжелее, чем выглядит, и руки у него сильные. Но драка кончается быстро, и после неё очень тихо. В кармане — рация.' },
    { t:'Отступить в криоотсек', go:'bay' }
  ] };

S.corr = { t:'Центральное кольцо',
  enter:s=>{ if(s.noise>=3 && !s.f.sing2) return 'sing2'; },
  text:s=>`Центральное кольцо станции: серые панели, красные полосы аварийных ламп. ${s.f.david_dead?'Тело Давида лежит у стены, там, где ты его оставил.':'Давид по-прежнему стоит у стены и поёт. Ты прошёл мимо — и он не заметил.'}

Налево — жилое кольцо, направо — камбуз и кают-компания. Дальше по кольцу: лифт в лабораторный сектор, массивная дверь машинного отделения, ангар и мостик.`,
  ch:[
    { t:'Жилое кольцо', go:'living' },
    { t:'Кают-компания и камбуз', go:'mess' },
    { t:'Машинное отделение', go:'eng' },
    { t:'Лифт в лабораторный сектор', go:'lab_lift' },
    { t:'Мостик', go:'bridge_door' },
    { t:'Ангар', go:'hangar_door' },
    { t:'Вернуться в криоотсек', go:'bay' }
  ] };

S.sing2 = { t:'Они услышали',
  text:`Шум не прошёл бесследно. С обоих концов коридора — шаги. Ровные, неторопливые, в такт ноте, которую ты теперь слышишь отовсюду. Двое. Они не бегут. Им некуда спешить.`,
  ch:[
    { t:'Рвануть в криоотсек и запереть рычаг', go:'bay', fx:s=>{ flag(s,'sing2'); s.noise=0; fear(s,2); },
      note:'Ты влетаешь в отсек и всем весом налегаешь на рычаг. Они бьются в дверь, потом перестают. Поют. Долго. Потом уходят.' },
    { t:'Включить рацию Давида на полную и бросить подальше', if:s=>has(s,'radio'), fx:s=>{ flag(s,'sing2'); s.noise=0; take(s,'radio'); }, go:'corr',
      note:'Рация орёт треском эфира. Они разворачиваются на звук, как подсолнухи на свет. Ты проскальзываешь мимо.' },
    { t:'Драться', fx:s=>{ flag(s,'sing2'); s.noise=0; hurt(s,5); fear(s,1); }, go:'corr',
      note:'Это длится дольше, чем ты думал. Потом остаётся только твоё тяжёлое дыхание и тишина.' }
  ] };
/* ЭХО-7 — данные игры (часть 2: жилое кольцо, камбуз, машинное, внешний выход) */

S.living = { t:'Жилое кольцо',
  text:`Узкий коридор с каютами по обе стороны. Таблички: «Вахрушева», «Давидов», «Орлова». В воздухе — запах остывшего кофе и чего-то сладкого, как прелое яблоко.

Из-за одной из дверей слышен шёпот.`,
  ch:[
    { t:'Каюта Давидова', go:'cab_david' },
    { t:'Каюта Вахрушевой (оттуда шёпот)', go:'cab_irina' },
    { t:'Каюта капитана Орловой', go:'cab_cap_door' },
    { t:'Назад в центральное кольцо', go:'corr' }
  ] };

S.cab_david = { t:'Каюта инженера',
  text:s=>`Каюта инженера аккуратнее, чем следовало ожидать. На столе — блокнот. Последняя запись датирована одиннадцатым днём, почерк плывёт:

«Они не поют — они ИЗЛУЧАЮТ. Частоту слышишь костями. Если станцию заглушить мощным звуком — они замолкают, пока шум длится. Рация… реактор… Код разбит на три части, у доктора, у капитана и на мостике. Если что — я оставил всё нужное в ящике стола».`,
  ch:[
    { t:'Открыть ящик стола', if:s=>!s.f.david_box, fx:s=>{ flag(s,'david_box'); give(s,'card1'); give(s,'sedative'); } },
    { t:'Назад', go:'living' }
  ] };

S.cab_irina = { t:'Каюта доктора',
  enter:s=>{ if(s.f.irina_done) return 'cab_irina_after'; },
  text:`Дверь приоткрыта. В каюте темно, горит только лабораторная лампа. Доктор Вахрушева сидит на койке, ссутулившись, и смотрит в пол. Она не поёт. Она шепчет цифры.

Когда ты входишь, она поднимает голову. Глаза у неё ясные, человеческие.

— Лев? — голос хриплый. — Ты ведь не слышал его? Скажи, что не слышал.`,
  ch:[
    { t:'«Нет. Я спал в капсуле»', go:'irina_talk' },
    { t:'«Что ты шепчешь?» (слушать до конца)', go:'irina_listen' },
    { t:'Ударить её ломиком', if:s=>has(s,'crowbar'), go:'irina_kill' },
    { t:'Тихо выйти', go:'living' }
  ] };

S.irina_talk = { t:'Каюта доктора',
  text:`Она выдыхает, будто держала воздух все эти дни.

— Тогда слушай. Пока тихо, я человек. Когда поёт — отдаюсь им на третьей ноте. Это я пишу себе в блокнот, чтобы помнить. Лёд — не лёд, Лев. Это что-то вроде нервной ткани, замёрзшей в породе до начала нашей эры. Она хочет только одного — чтобы её слушали.

Вахрушева протягивает листок:

— Моя часть кода реактора: сорок один. Остальное у капитана и в журнале вахты. И… в лабораторном холодильнике сыворотка V-7. Она не проверена на людях. Принимай до, а не после.

Она отворачивается к стене.

— Уходи, пока я ещё помню своё имя.`,
  ch:[ { t:'Уйти', fx:s=>{ flag(s,'irina_done'); flag(s,'irina_alive'); flag(s,'code_a'); flag(s,'serum_hint'); sys(s,'Код реактора: часть А записана'); }, go:'living' } ] };

S.irina_listen = { t:'Каюта доктора',
  text:`Ты подходишь ближе и слушаешь. Сначала — цифры. Потом слова между цифрами. Потом то, что лежит под словами: ровный тон, очень чистый, очень ласковый.

Ты слышишь, что хочет лёд. Он не хочет убивать. Он просто устал быть один.

Рука доктора стискивает твою:

— Лев, не слушай до конца!

Но ты уже услышал достаточно. Код А — сорок один — записан у тебя в голове, как и ещё кое-что: «нагреть керн до температуры плазмы». Эта мысль не твоя.`,
  ch:[ { t:'Вырваться и выйти', fx:s=>{ flag(s,'irina_done'); flag(s,'irina_alive'); flag(s,'code_a'); flag(s,'heard'); flag(s,'hint_cutter'); fear(s,3); sys(s,'Код реактора: часть А записана'); sys(s,'Ты слышал Хор: шаттл с тобой на борту рискует стать носителем'); }, go:'living' } ] };

S.irina_kill = { t:'Каюта доктора',
  text:`Ты бьёшь быстро, пока она ещё в себе. Она не сопротивляется. Только успевает сказать:

— Спасибо.

На койке остаётся блокнот. В нём — «41» обведено дважды. Ничего больше.`,
  ch:[ { t:'Забрать блокнот и выйти', fx:s=>{ flag(s,'irina_done'); flag(s,'code_a'); flag(s,'hint_cutter'); fear(s,2); hurt(s,1); loud(s,1); sys(s,'Код реактора: часть А записана'); }, go:'living' } ] };

S.cab_irina_after = { t:'Каюта доктора',
  text:s=>s.f.irina_alive
    ? `Вахрушева лежит лицом к стене и больше не поворачивается. Ты слышишь её шёпот: цифры. Ты решаешь не мешать.`
    : `Каюта пуста и тиха. На койке — прикрытое одеялом тело.`,
  ch:[ { t:'Выйти', go:'living' } ] };

S.cab_cap_door = { t:'Каюта капитана',
  text:`Дверь каюты Орловой — с красной маркировкой второго уровня. Электронный замок мигает отказом.`,
  ch:[
    { t:'Подцепить дверь ломиком (шумно)', if:s=>has(s,'crowbar') && !s.f.cap_open, fx:s=>{ flag(s,'cap_open'); loud(s,1); }, go:'cab_captain',
      note:'Металл визжит. Ты взмокаешь, пока замок сдаётся. Где-то по кольцу слышно, как нота на секунду сбивается.' },
    { t:'Войти (дверь взломана)', if:s=>s.f.cap_open, go:'cab_captain' },
    { t:'Назад', go:'living' }
  ] };

S.cab_captain = { t:'Каюта капитана',
  text:s=>`Капитан Орлова сидит у стола с пустым шприцем в руке. Ушла тихо и осознанно: на столе записка, красная ключ-карта и распечатанный лист с кодом.

/* ЭХО-7 — ядро (без DOM, чтобы тестировать в node) */
function newState(){
  return { hp:10, san:10, o2:100, inv:[], f:{}, noise:0, clock:null, scene:'start', msgs:[], moves:0 };
}
function visible(sc,s){ return (sc.ch||[]).filter(c=>!c.if || c.if(s)); }
function settle(s){
  if(S[s.scene].end) return null;
  if(s.o2<=0) return 'end_o2';
  if(s.hp<=0) return 'end_hp';
  if(s.san<=0) return 'end_san';
  if(s.clock!==null && s.clock<=0) return 'end_too_late';
  return null;
}
function moveTo(s,id){
  const sc=S[id];
  if(!sc) throw new Error('no scene '+id);
  if(!sc.safe && !sc.end) s.o2 -= (sc.cost||3);
  if(s.clock!==null && !sc.end) s.clock -= 1;
  s.scene=id; s.moves++;
  if(sc.enter){ const r=sc.enter(s); if(r){ s.scene=r; } }
  const d=settle(s); if(d) s.scene=d;
}
function choose(s,i){
  const sc=S[s.scene], vis=visible(sc,s), c=vis[i];
  if(!c) return false;
  if(c.fx) c.fx(s);
  if(c.note) s.msgs.push({k:'n',t:c.note});
  const tgt = typeof c.go==='function' ? c.go(s) : c.go;
  if(tgt) moveTo(s,tgt);
  else { const d=settle(s); if(d) s.scene=d; }
  return true;
}
function useItem(s,item){
  const k=s.inv.indexOf(item); if(k<0) return;
  if(item==='med'){ s.inv.splice(k,1); heal(s,4); }
  else if(item==='sedative'){ s.inv.splice(k,1); calm(s,3); }
  else if(item==='serum'){ s.inv.splice(k,1); s.f.heard=false; calm(s,3); sys(s,'Сыворотка подействовала: эхо в голове стихает'); }
}
function sceneText(sc,s){ return typeof sc.text==='function' ? sc.text(s) : sc.text; }
function choiceLabel(c,s){ return typeof c.t==='function' ? c.t(s) : c.t; }
if(typeof module!=='undefined') module.exports={newState,visible,settle,moveTo,choose,useItem,sceneText,choiceLabel};
/* ЭХО-7 — звук: всё синтезируется в браузере (Web Audio), файлов нет */
const SND = (function(){
  const KEY='echo7_snd_v1', VOL=0.5;
  let ac=null, master=null, comp=null, nodes={}, noiseBuf=null, analyser=null;
  let enabled=true; try{ enabled = localStorage.getItem(KEY)!=='0'; }catch(e){}
  // насколько «поёт» Хор в сцене (0..1)
  const CH = { sing1:.5, sing2:.8, cab_irina:.4, irina_listen:.9, irina_talk:.3, gosha:.4, mess:.2, lab_hall:.7,
               lab_core:.9, lab_listen:1, lab_destroy:.8, bridge:.3, timur:.5, broadcast:.7, hangar:.3, vent:.4 };

  function build(){
    ac = new (window.AudioContext||window.webkitAudioContext)();
    comp = ac.createDynamicsCompressor();
    comp.threshold.value=-20; comp.knee.value=20; comp.ratio.value=6; comp.attack.value=.005; comp.release.value=.25;
    master = ac.createGain(); master.gain.value=0;
    master.connect(comp); comp.connect(ac.destination);

    const len=Math.floor(ac.sampleRate*2); noiseBuf=ac.createBuffer(1,len,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;

    // гул станции
    const dg=ac.createGain(); dg.gain.value=0;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=170; lp.Q.value=1.2;
    const o1=ac.createOscillator(); o1.type='sawtooth'; o1.frequency.value=55;
    const o2=ac.createOscillator(); o2.type='sawtooth'; o2.frequency.value=55.4;
    const o3=ac.createOscillator(); o3.type='sine'; o3.frequency.value=110;
    const g3=ac.createGain(); g3.gain.value=.4;
    o1.connect(lp); o2.connect(lp); o3.connect(g3); g3.connect(lp); lp.connect(dg); dg.connect(master);
    const lfo=ac.createOscillator(); lfo.frequency.value=.07;
    const lfog=ac.createGain(); lfog.gain.value=45; lfo.connect(lfog); lfog.connect(lp.frequency);
    [o1,o2,o3,lfo].forEach(o=>o.start());

    // шум вентиляции
    const ns=ac.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
    const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=450; bp.Q.value=.6;
    const ag=ac.createGain(); ag.gain.value=0;
    ns.connect(bp); bp.connect(ag); ag.connect(master); ns.start();

    // диссонанс (малая секунда) — растёт со страхом
    const dis=ac.createGain(); dis.gain.value=0;
    [311.13,329.63].forEach(f=>{ const o=ac.createOscillator(); o.type='sine'; o.frequency.value=f; o.connect(dis); o.start(); });
    dis.connect(master);

    // Хор: чистый тон с вибрато
    const ch=ac.createGain(); ch.gain.value=0;
    const vib=ac.createOscillator(); vib.frequency.value=5.2;
    const vg=ac.createGain(); vg.gain.value=2.2; vib.connect(vg); vib.start();
    [220,329.63,440,554.37].forEach((f,i)=>{
      const o=ac.createOscillator(); o.type= i%2 ? 'triangle':'sine'; o.frequency.value=f; vg.connect(o.frequency);
      const og=ac.createGain(); og.gain.value= i===3 ? .25 : .6; o.connect(og); og.connect(ch); o.start();
    });
    ch.connect(master);
    nodes={dg,lp,o2,ag,bp,dis,ch};
  }

  function env(g,t,d,vol){
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+Math.min(.012,d/4));
    g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  }
  function tone(f,d,type,vol,when,slide){
    const t=when||ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(1,slide),t+d);
    env(g,t,d,vol); o.connect(g); g.connect(master); o.start(t); o.stop(t+d+.05);
  }
  function burst(d,vol,freq,type,when,q){
    const t=when||ac.currentTime, s2=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
    s2.buffer=noiseBuf; f.type=type||'lowpass'; f.frequency.value=freq; if(q) f.Q.value=q;
    env(g,t,d,vol); s2.connect(f); f.connect(g); g.connect(master); s2.start(t,Math.random()); s2.stop(t+d+.05);
  }
  function chord(freqs,d,type,vol,vibrato){
    const t=ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*.07);
      g.gain.linearRampToValueAtTime(vol,t+i*.07+d*.35);
      g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      if(vibrato){ const v=ac.createOscillator(), vg=ac.createGain(); v.frequency.value=5; vg.gain.value=3; v.connect(vg); vg.connect(o.frequency); v.start(t); v.stop(t+d+.1); }
      o.connect(g); g.connect(master); o.start(t+i*.07); o.stop(t+d+.1);
    });
  }
  function beat(t){ tone(75,.16,'sine',.26,t,38); tone(65,.14,'sine',.15,t+.19,34); }
  function warn(t){ tone(620,.11,'sine',.07,t); }

  function sfx(name,arg){
    if(!ac||!enabled) return;
    const t=ac.currentTime;
    switch(name){
      case 'click': tone(1500,.035,'square',.03); tone(700,.05,'sine',.05); break;
      case 'scene': burst(.22,.05,1800,'bandpass',t,.8); break;
      case 'dmg': burst(.28,.5,500,'lowpass'); tone(130,.32,'sine',.55,t,38); break;
      case 'fear': tone(640,1.0,'sine',.11,t,300); tone(677,1.0,'sine',.09,t,318); burst(.9,.05,5200,'highpass',t); break;
      case 'heal': tone(523,.18,'triangle',.12,t); tone(659,.18,'triangle',.12,t+.1); tone(784,.3,'triangle',.12,t+.2); break;
      case 'calm': tone(392,.6,'sine',.1,t,523); tone(262,.7,'sine',.08,t+.05); break;
      case 'air': for(let i=0;i<5;i++) tone(750+Math.random()*700,.06,'sine',.05,t+i*.06); burst(.5,.06,3000,'highpass',t); break;
      case 'pickup': tone(880,.07,'triangle',.1,t); tone(1175,.07,'triangle',.1,t+.07); tone(1568,.14,'triangle',.1,t+.14); break;
      case 'alarm': tone(880+(9-(arg||0))*35,.1,'square',.05,t); tone(880+(9-(arg||0))*35,.1,'square',.04,t+.16); break;
      case 'siren': tone(300,1.6,'sawtooth',.07,t,900); tone(305,1.6,'sawtooth',.05,t,910); break;
      case 'end':
        if(arg==='best') chord([261.6,329.6,392,523.3],3.2,'triangle',.11);
        else if(arg==='good') chord([261.6,329.6,392],2.8,'triangle',.1);
        else if(arg==='neutral') chord([196,293.7],2.6,'sine',.12);
        else if(arg==='weird') chord([220,329.6,440,554.4],3.6,'sine',.09,true);
        else { chord([55,58.3],3.2,'sawtooth',.07); burst(1.2,.15,300,'lowpass'); }
        break;
    }
  }

  function update(st){
    if(!ac||!enabled) return;
    const t=ac.currentTime, inGame=!!st;
    const stress= inGame ? (10-st.san)/10 : 0;
    const sceneI= inGame ? (CH[st.scene]||0) : 0;
    const end = inGame && S[st.scene] && S[st.scene].end;
    const danger = inGame && st.clock!==null;
    const set=(p,v,tc)=>p.setTargetAtTime(v,t,tc||.7);
    set(nodes.dg.gain, end ? .025 : (inGame ? .09+stress*.02 : .06), .9);
    set(nodes.lp.frequency, 150+stress*380+(danger?100:0), 1);
    set(nodes.o2.frequency, 55+stress*2.8, 1.2);
    set(nodes.ag.gain, inGame ? .02+stress*.012 : .012, 1);
    set(nodes.bp.frequency, 400+stress*900, 1);
    set(nodes.dis.gain, stress>.3 ? stress*stress*.025 : 0, 1);
    set(nodes.ch.gain, end ? 0 : Math.max(sceneI*.035, Math.max(0,stress-.3)*.03), 1.2);
  }

  let nextBeat=0, nextWarn=0, curState=null;
  setInterval(()=>{
    if(!ac||!enabled||document.hidden||!curState) return;
    const st=curState, t=ac.currentTime;
    if(S[st.scene].end) return;
    if(st.hp<=3){
      const per= st.hp<=1 ? .55 : st.hp===2 ? .7 : .85;
      if(nextBeat<t) nextBeat=t+.05;
      while(nextBeat<t+.25){ beat(nextBeat); nextBeat+=per; }
    }
    if(st.o2<=20){
      if(nextWarn<t) nextWarn=t+.05;
      while(nextWarn<t+.25){ warn(nextWarn); nextWarn+=2.4; }
    }
  },120);

  function start(st){
    curState = st||null;
    if(!enabled) return;
    if(!ac){ try{ build(); }catch(e){ ac=null; return; } }
    if(ac.state==='suspended') ac.resume();
    master.gain.setTargetAtTime(VOL, ac.currentTime, .3);
    update(st||null);
  }
  function setState(st){ curState = st||null; }
  function setEnabled(v){
    enabled=!!v; try{ localStorage.setItem(KEY, enabled?'1':'0'); }catch(e){}
    if(enabled) start(curState);
    else if(ac) master.gain.setTargetAtTime(0, ac.currentTime, .08);
  }
  document.addEventListener('visibilitychange',()=>{
    if(!ac||!enabled) return;
    if(document.hidden) ac.suspend(); else ac.resume();
  });
  function probe(){
    if(!ac) return null;
    if(!analyser){ analyser=ac.createAnalyser(); analyser.fftSize=2048; comp.connect(analyser); }
    const a=new Float32Array(2048); analyser.getFloatTimeDomainData(a);
    let pk=0, ss=0; for(const v of a){ const x=Math.abs(v); if(x>pk) pk=x; ss+=v*v; }
    return { peak:pk, rms:Math.sqrt(ss/a.length), state:ac.state };
  }
  return { start, update:(st)=>{ curState=st||null; update(st); }, sfx, setEnabled, probe, setState,
           isOn:()=>enabled, hasCtx:()=>!!ac };
})();

function glitch(str, san){
  if(san>3) return str;
  const p = san<=1 ? 0.07 : san<=2 ? 0.045 : 0.025;
  const sym = ['▒','░','~','·','†'];
  let out='';
  for(const ch of str){
    if(/[а-яёa-z]/i.test(ch) && Math.random()<p) out += sym[Math.floor(Math.random()*sym.length)];
    else out += ch;
  }
  return out;
}

    if(pv!=null){ if(i>=n && i<pv) c+=' lost'; if(i<n && i>=pv) c+=' gain'; }

  return h;
}

    if(s.san<P.san){ SND.sfx('fear'); flash('fear'); floatNum('bar-san','−'+(P.san-s.san),'fear'); }
    else if(s.san>P.san){ SND.sfx('calm'); flash('calm'); floatNum('bar-san','+'+(s.san-P.san),'pos'); }
    if(s.o2>P.o2+5){ SND.sfx('air'); flash('air'); floatNum('bar-o2','+'+Math.round(s.o2-P.o2)+'%','pos'); }
  }

  if(P && s.clock!==null){ if(P.clock===null) SND.sfx('siren'); else if(P.clock!==s.clock) SND.sfx('alarm', s.clock); }
  // инвентарь
  const counts = {}; s.inv.forEach(i=>counts[i]=(counts[i]||0)+1);
  const inv = $('inv'); inv.innerHTML='';
  const keys = Object.keys(counts);
  if(!keys.length) inv.innerHTML = '<span class="muted">пусто</span>';
  let newItem=false;
  keys.forEach(k=>{
    const usable = ['med','sedative','serum'].includes(k);
    const el = document.createElement(usable?'button':'span');
    const isNew = P && (!(k in P.counts) || counts[k]>P.counts[k]);
    if(isNew) newItem=true;
    el.className = 'chip' + (usable?' use':'') + (isNew?' new':'');
    el.innerHTML = icon(k)+'<span></span>';
    el.lastChild.textContent = ITEMS[k] + (counts[k]>1?' ×'+counts[k]:'');
    el.title = ITEM_DESC[k]||'';
    if(usable) el.onclick = ()=>{ useItem(s,k); render(); };
    inv.appendChild(el);
  });
  // заметки
  const a = s.f.code_a?CODE.a:'??', b = s.f.code_b?CODE.b:'??', c = s.f.code_c?CODE.c:'??';
  const nk = [s.f.code_a,s.f.code_b,s.f.code_c].filter(Boolean).length;
  const codeNew = P && nk>P.codes;
  let notes = '<div class="note'+(codeNew?' newn':'')+'"><b>Код реактора:</b> '+a+' · '+b+' · '+c+'</div>';
  if(s.f.hint_cutter) notes += '<div class="note">Хор замолкает, если прогреть керн плазмой.</div>';
  if(s.f.lore_ice) notes += '<div class="note">Нота идёт из-под льда Мирры.</div>';
  $('notes').innerHTML = notes;
  if(newItem) SND.sfx('pickup');
  prev = { hp:s.hp, san:s.san, o2:s.o2, counts:counts, codes:nk, clock:s.clock };
}

function render(){
  const sc = S[s.scene];
  renderHud();
  const tt=$('title');
  if(s.scene!==lastScene){
    const firstScene = lastScene===null;
    lastScene=s.scene;
    if(!firstScene) SND.sfx('scene');
    if(sc.end) SND.sfx('end', sc.kind);
    if(!REDUCED){ restartClass($('wipe'),'go'); scramble(tt, sc.t, 380); } else tt.textContent = sc.t;
  } else tt.textContent = sc.t;
  // сообщения
  const m = $('msgs'); m.innerHTML='';
  s.msgs.forEach(x=>{
    const d=document.createElement('div'); d.className = x.k==='n'?'narr':'sysmsg'; d.textContent=x.t; m.appendChild(d);
  });
  s.msgs.length = 0;
  // текст
  const raw = sceneText(sc,s);
  const body = $('text'); body.innerHTML='';
  let pi=0;
  raw.split('\n\n').forEach(p=>{
    if(!p.trim()) return;
    const el=document.createElement('p'); el.textContent = glitch(p.trim(), s.san);
    el.style.animationDelay = REDUCED?'0s':(0.05+pi*0.2)+'s'; pi++; body.appendChild(el);
  });
  const choiceBase = REDUCED?0:(0.05+pi*0.2+0.1);
  if(s.san<=3 && !sc.end){
    const w=document.createElement('p'); w.className='whisper';
    w.textContent = WHISPERS[Math.floor(Math.random()*WHISPERS.length)]; w.style.animationDelay=(REDUCED?0:(0.05+pi*0.2))+'s'; body.appendChild(w);
  }
  document.body.className = 'san' + (s.san<=3?'3':s.san<=6?'6':'10');
  // выборы
  const box = $('choices'); box.innerHTML='';
  if(sc.end){
    if(!endsSeen.includes(s.scene)){ endsSeen.push(s.scene); lsSet(END_KEY, JSON.stringify(endsSeen)); }
    lsDel(SAVE_KEY);
    box.className = 'choices endbox kind-'+sc.kind;
    const info=document.createElement('div'); info.className='endinfo';
    info.innerHTML = '<div class="endtag">КОНЦОВКА</div><div class="endcount">Открыто концовок: '+endsSeen.length+' из '+TOTAL_ENDS+'</div>';
    box.appendChild(info);
    const b=document.createElement('button'); b.className='choice primary'; b.textContent='Начать заново'; b.style.animationDelay=(choiceBase+0.5)+'s';
    b.onclick=()=>{ startGame(); }; box.appendChild(b);
    const b2=document.createElement('button'); b2.className='choice'; b2.textContent='В главное меню'; b2.style.animationDelay=(choiceBase+0.6)+'s';
    b2.onclick=showMenu; box.appendChild(b2);
  } else {
    box.className='choices';
    visible(sc,s).forEach((c,i)=>{
      const b=document.createElement('button'); b.className='choice' + (s.san<=4 && /прижать|ответить/i.test(choiceLabel(c,s))?' whisperc':'');
      b.innerHTML = '<span class="num">'+(i+1)+'</span><span></span>';
      b.lastChild.textContent = choiceLabel(c,s);
      b.style.animationDelay=(choiceBase+i*0.05)+'s'; b.onclick=()=>pick(i); box.appendChild(b);
    });
  }
  SND.update(s);
  save();
  window.scrollTo({top:0});
}

function pick(i){
  SND.sfx('click');
  const before = s.scene;
  choose(s,i);
  render();
}

document.addEventListener('keydown',e=>{
  if($('game').style.display==='none') return;
  const n = parseInt(e.key,10);
  if(n>=1 && n<=9) { const vis = visible(S[s.scene],s); if(vis[n-1]) pick(n-1); }
});

function startGame(){
  s = newState(); prev=null; lastScene=null; showGame(); render();
}
function continueGame(){
  try{ s = JSON.parse(lsGet(SAVE_KEY)); }catch(e){ s=null; }
  if(!s || !S[s.scene]){ startGame(); return; }
  prev=null; lastScene=null; showGame(); render();
}
function showGame(){ $('menu').style.display='none'; $('game').style.display='block'; }
function showMenu(){
  SND.update(null);
  $('game').style.display='none'; $('menu').style.display='flex'; document.body.className='';
  $('contbtn').style.display = lsGet(SAVE_KEY) ? 'block' : 'none';
  menuIntro();
  $('endsline').textContent = endsSeen.length ? 'Открыто концовок: '+endsSeen.length+' из '+TOTAL_ENDS : 'Концовок: '+TOTAL_ENDS+'. Найди их все.';
}
$('newbtn').onclick = ()=>{ lsDel(SAVE_KEY); startGame(); };
$('contbtn').onclick = continueGame;
$('menubtn').onclick = ()=>{ save(); showMenu(); };


/* ——— Живая звуковая волна («Хор») ——— */
const cv = $('wave'), cx = cv.getContext('2d');
function sizeWave(){
  const r = window.devicePixelRatio||1;
  cv.width = Math.floor(innerWidth*r); cv.height = Math.floor(200*r);
  cx.setTransform(r,0,0,r,0,0);
}
addEventListener('resize', sizeWave); sizeWave();
let waveAmp = 10, curRGB = '127,227,208';
function drawWave(t){
  const w=innerWidth, h=200;
  cx.clearRect(0,0,w,h);
  const inGame = s && $('game').style.display==='block';
  const san = inGame ? s.san : 10;
  const stress = (10-san)/10;
  const target = (inGame?8:16) + stress*38 + (inGame?Math.min(s.noise,6)*4:0);
  waveAmp += (target-waveAmp)*0.03;
  const danger = inGame && s.clock!==null;
  const rgb = curRGB = danger ? '255,100,90' : stress>=0.6 ? '183,155,255' : '127,227,208';
  const speed = 0.0006*(1+stress*3 + (danger?2:0));
  for(let k=0;k<4;k++){
    cx.beginPath();
    for(let x=0;x<=w;x+=5){
      const env = 0.55+0.45*Math.sin(x*0.0035 + t*0.00035*(k+1));
      const y = h*0.68 + Math.sin(x*0.011*(1+k*0.55) + t*speed*(k+1)) * waveAmp*(1-k*0.2)*env
              + (stress>0.6 ? (Math.random()-0.5)*stress*3 : 0);
      x===0 ? cx.moveTo(x,y) : cx.lineTo(x,y);
    }
    cx.strokeStyle = 'rgba('+rgb+','+(0.30-k*0.06)+')';
    cx.lineWidth = 1.6-k*0.2; cx.stroke();
  }
}
let rafOn = true;
function loop(t){ if(rafOn){ drawWave(t); drawDust(t); } requestAnimationFrame(loop); }
document.addEventListener('visibilitychange',()=>{ rafOn = !document.hidden; });
if(REDUCED) drawWave(0); else requestAnimationFrame(loop);

/* случайный глитч заголовка меню */
setInterval(()=>{
  const h=document.querySelector('#menu h1');
  if(!h || $('menu').style.display==='none' || REDUCED) return;
  h.classList.add('gl'); setTimeout(()=>h.classList.remove('gl'),140);
  setTimeout(()=>{ h.classList.add('gl'); setTimeout(()=>h.classList.remove('gl'),220); },260);
}, 2600);
setInterval(()=>{
  const h=document.querySelector('#menu h1');
  if(!h || $('menu').style.display==='none' || REDUCED) return;
  scramble(h,'ЭХО-7',380);
}, 9000);


/* ——— Расшифровка текста, печать, пинг, пыль, случайные «сбои» ——— */
const GLY = '█▓▒░#@%&§¤ЖЩФЭ7/\\';
function scramble(el, text, dur){
  if(REDUCED){ el.textContent=text; if(el.dataset) el.dataset.t=text; return; }
  const id = (el._sc=(el._sc||0)+1), t0=performance.now(), n=text.length;
  (function step(){
    if(el._sc!==id) return;
    const p=(performance.now()-t0)/dur;
    if(p>=1){ el.textContent=text; if(el.dataset && el.hasAttribute('data-t')) el.dataset.t=text; return; }
    let out='';
    for(let i=0;i<n;i++){
      const ch=text[i];
      out += (ch===' ' || p >= (i/n)*0.7+0.3) ? ch : GLY[Math.floor(Math.random()*GLY.length)];
    }
    el.textContent=out;
    requestAnimationFrame(step);
  })();
}
function typeText(el, text, dur){
  if(REDUCED){ el.textContent=text; return; }
  el.innerHTML='<span></span><span style="visibility:hidden"></span>';
  const a=el.children[0], b=el.children[1], id=(el._ty=(el._ty||0)+1), t0=performance.now(), n=text.length;
  (function step(){
    if(el._ty!==id) return;
    const p=Math.min(1,(performance.now()-t0)/dur), k=Math.floor(p*n);
    a.textContent = text.slice(0,k) + (p<1?'▌':'');
    b.textContent = text.slice(k);
    if(p<1) requestAnimationFrame(step); else { el.textContent=text; }
  })();
}
let TAG_FULL = null;
function menuIntro(){
  const h=document.querySelector('#menu h1'), tag=document.querySelector('#menu .tag');
  if(!h||!tag) return;
  if(TAG_FULL===null) TAG_FULL = tag.textContent;
  scramble(h,'ЭХО-7',650);
  setTimeout(()=>typeText(tag, TAG_FULL, 1000), 250);
}

document.addEventListener('pointerdown', e=>{
  if(REDUCED) return;
  if(!e.target.closest || !e.target.closest('.choice,.btn,.chip,#menubtn')) return;
  const p=document.createElement('div'); p.className='ping'; p.style.left=e.clientX+'px'; p.style.top=e.clientY+'px';
  document.body.appendChild(p); setTimeout(()=>p.remove(),700);
}, true);

const dcv=$('dust'), dx=dcv.getContext('2d');
let DUST=[];
function sizeDust(){
  const r=window.devicePixelRatio||1;
  dcv.width=Math.floor(innerWidth*r); dcv.height=Math.floor(innerHeight*r); dx.setTransform(r,0,0,r,0,0);
  const n = innerWidth<600 ? 36 : 80;
  DUST=[]; for(let i=0;i<n;i++) DUST.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.7+.4,v:Math.random()*.25+.06,ph:Math.random()*6.28,a:Math.random()*.5+.15});
}
addEventListener('resize', sizeDust); sizeDust();
function drawDust(t){
  if(REDUCED) return;
  dx.clearRect(0,0,innerWidth,innerHeight);
  const inGame = s && $('game').style.display==='block';
  const k = inGame && s.san<=3 ? 2.4 : 1;
  for(const d of DUST){
    d.y -= d.v*k; d.x += Math.sin(t*0.0006+d.ph)*0.25*k;
    if(d.y<-5){ d.y=innerHeight+5; d.x=Math.random()*innerWidth; }
    const tw = 0.55+0.45*Math.sin(t*0.002+d.ph*3);
    dx.beginPath(); dx.arc(d.x,d.y,d.r,0,6.283);
    dx.fillStyle='rgba('+curRGB+','+(d.a*tw)+')'; dx.fill();
  }
}

(function blipLoop(){
  setTimeout(()=>{
    if(!REDUCED){ document.body.classList.add('blip'); setTimeout(()=>document.body.classList.remove('blip'),260); }
    blipLoop();
  }, (6000+Math.random()*9000) * ((s && s.san<=3) ? 0.35 : 1));
})();

function inGameNow(){ return $('game').style.display==='block' && s; }
function syncSnd(){
  const on = SND.isOn();
  ['sndbtn','sndbtn2'].forEach(id=>{ const el=$(id); if(el){ el.textContent = on ? 'ЗВУК: ВКЛ' : 'ЗВУК: ВЫКЛ'; el.classList.toggle('off',!on); } });
}
function toggleSound(){ SND.setEnabled(!SND.isOn()); SND.setState(inGameNow()?s:null); if(SND.isOn()) SND.update(inGameNow()?s:null); syncSnd(); }
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,()=>{ if(SND.isOn() && !SND.hasCtx()) SND.start(inGameNow()?s:null); else if(SND.isOn()) SND.start(inGameNow()?s:null); },true));
$('sndbtn').onclick = toggleSound;
$('sndbtn2').onclick = toggleSound;
document.addEventListener('keydown',e=>{ if((e.key==='m'||e.key==='M'||e.key==='ь'||e.key==='Ь') && !e.ctrlKey && !e.metaKey) toggleSound(); });
syncSnd();

showMenu();
</script>
